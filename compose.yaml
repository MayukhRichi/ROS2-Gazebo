services:
  ros:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ros2_dev

    stdin_open: true
    tty: true

    ports:
      - "127.0.0.1:6080:6080"

    volumes:
      - ./workspace:/workspace

    working_dir: /workspace

    shm_size: "2gb"

    environment:
      DISPLAY: ":1"
      LIBGL_ALWAYS_SOFTWARE: "1"
      QT_X11_NO_MITSHM: "1"

    restart: unless-stopped
